[tools]
"npm:versions" = "latest"
shellcheck = "0.11.0"
shellspec = "0.28.1"
shfmt = "3.9.0"

[vars]
scripts = "bin/* command/* common.bash lib/*.bash plugin/* mise-tasks/*"
completion_scripts = "completion/*.bash"

[tasks]
test = "shellspec"
lint = "shellcheck --severity=error {{vars.scripts}}"
lint-all = "shellcheck {{vars.scripts}} {{vars.completion_scripts}}"
fmt = "shfmt -w {{vars.scripts}}"
fmt-check = "shfmt -d {{vars.scripts}}"
check = [{ task = "lint" }, { task = "fmt-check" }, { task = "test" }]
all = [{ task = "check" }]
