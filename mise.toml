[tools]
shellcheck = "0.11.0"
shellspec = "0.28.1"
shfmt = "3"

[vars]
scripts = "bin/* command/* common.bash completion/*.bash lib/*.bash plugin/*"

[tasks]
test = "shellspec"
lint = "shellcheck --severity=error {{vars.scripts}}"
fmt = "shfmt {{vars.scripts}}"
fmt-check = "shfmt -d {{vars.scripts}}"
